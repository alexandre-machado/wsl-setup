# mARC — per-repo team binding (generated by /marc:init; edit freely).
# Schema: docs/team.toml.example. Standard TOML; inline comments are fine.
# HARD RULE: keep every key name unique across the whole file — the plugin's
# zero-dependency shell snippets extract values by key name alone.

[github]
gh_org = "alexandre-machado"
gh_repo = "alexandre-machado/wsl-setup"
# The GitHub Project (v2) number that is the team's source-of-truth board.
# WARNING if left as TODO: set this before dispatching, or issues may land on the
# wrong board. Do NOT use the owner's auto-created "untitled" project (often #1).
project_number = "TODO_project_number"

[architecture]
agents_doc = "AGENTS.md"

[paths]
# Shell/PowerShell setup repo: the scripts ARE the app; no separate IaC/UI/test dirs.
app_paths = ["setup.sh", "cleanup.sh", "wsl-setup.ps1", "scripts/"]
iac_paths = []
test_paths = []
ui_paths = []

[validation]
# No CI or automated test suite exists; syntax-check every shell script.
validation_command = "bash -n setup.sh cleanup.sh scripts/*.sh"
# Non-destructive smoke of the cleanup flow:
health_check_command = "./cleanup.sh --dry-run"

[release]
# No deploy pipeline: the bootstrap clones `main` at runtime, so merge-to-main IS the release.
has_release_pipeline = "false"
release_notes = "No CI/CD. Validate via bash -n + cleanup.sh --dry-run; bootstrap/installer changes need a manual smoke run on a fresh WSL instance; wsl-setup.ps1 is only truly testable on Windows."
