# tmux configuration (installed to ~/.tmux.conf by scripts/dotfiles.sh)

# Let OSC escape sequences pass through to the outer terminal
# (clipboard integration with VS Code / Windows Terminal; tmux >= 3.3)
set -g allow-passthrough on
set -s set-clipboard on

# Correct $TERM and true-color inside panes
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

# Sensible minimal defaults
set -g mouse on
set -g history-limit 50000
set -s escape-time 10
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Prefix configuration: support both Ctrl+A (ideal for VS Code) and Ctrl+B
set -g prefix C-a
set -g prefix2 C-b
bind-key C-a send-prefix
bind-key C-b send-prefix -2

# Visual indicator in status line when prefix key is pressed
set -g status-left-length 40
set -g status-left "#{?client_prefix,#[bg=red]#[fg=white]#[bold] PREFIX #[default] ,}[#S] "

# Intuitive pane splits keeping current working directory
bind-key | split-window -h -c "#{pane_current_path}"
bind-key v split-window -h -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"
bind-key s split-window -v -c "#{pane_current_path}"
bind-key c new-window -c "#{pane_current_path}"
bind-key C-c new-window -c "#{pane_current_path}"
bind-key C-z resize-pane -Z
bind-key C-d detach-client

# Pane navigation with vim keys
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Mouse selection copies directly to Windows clipboard via OSC 52 (native; no clip.exe fork)
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-selection-and-cancel

# Let the outer terminal (VS Code / Windows Terminal) handle paste natively
# (avoids duplicate paste when right-clicking and preserves Ctrl+V in terminal apps)
unbind-key -n MouseDown3Pane
unbind-key -n C-v
