# tmux configuration (installed to ~/.tmux.conf by scripts/dotfiles.sh)

# Let OSC escape sequences pass through to the outer terminal
# (clipboard integration with VS Code / Windows Terminal; tmux >= 3.3)
set -g allow-passthrough on
set -s set-clipboard on

# Correct $TERM and true-color inside panes
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

# Sensible minimal defaults
set -g mouse on
set -g history-limit 50000
set -s escape-time 10
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Mouse selection copies directly to Windows clipboard
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "clip.exe"
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "clip.exe"

# Right-click pastes from Windows clipboard into active pane
bind-key -n MouseDown3Pane run-shell "powershell.exe -NoProfile -Command Get-Clipboard | tr -d '\r' | tmux load-buffer - && tmux paste-buffer"
